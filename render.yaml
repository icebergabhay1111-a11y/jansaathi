# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Creates a free PostgreSQL database and one web service (website + API).
databases:
  - name: jansaathi-db
    plan: free
    databaseName: jansaathi
    user: jansaathi

services:
  - type: web
    name: jansaathi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jansaathi-db
          property: connectionString
      - key: JANSAATHI_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false   # Render asks for this when you create the Blueprint; leave blank to run without AI
      - key: ADMIN_EMAIL
        sync: false   # optional: your email, to get an admin account for /admin
      - key: ADMIN_PASSWORD
        sync: false   # optional: at least 12 characters
