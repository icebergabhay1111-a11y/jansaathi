# Local production-like stack: PostgreSQL + FastAPI + Next.js
# Usage: cp backend/.env.example .env  (set SECRET_KEY, optionally GEMINI_API_KEY) && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jansaathi
      POSTGRES_USER: jansaathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jansaathi"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    environment:
      JANSAATHI_ENV: production
      DATABASE_URL: postgresql+psycopg://jansaathi:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/jansaathi
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CORS_ORIGINS: http://localhost:3000
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment: { BACKEND_URL: http://api:8000 }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
